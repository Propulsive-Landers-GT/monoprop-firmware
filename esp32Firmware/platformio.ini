[platformio]
default_envs = featheresp32

[env:featheresp32]
; Portable project settings: open esp32Firmware on the deployment computer.
; PlatformIO installs the board platform/framework/toolchain there as needed.
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
; Required by the compile-time packaging selection (if constexpr).
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Bench-only round trip. No Teensy UART initialization or forwarding.
[env:featheresp32-echo]
extends = env:featheresp32
build_flags = ${env:featheresp32.build_flags} -DBRIDGE_ECHO_TEST=1
